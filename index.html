<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Recorder</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #f0f4f8;
        background-color: #0e1a2b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      main {
        width: min(90vw, 600px);
        padding: 2rem;
        background: rgba(18, 32, 56, 0.85);
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        display: grid;
        gap: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
        text-align: center;
      }

      label {
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      select,
      button {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: none;
        font-size: 1rem;
        font-weight: 600;
      }

      select {
        background-color: #112542;
        color: inherit;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      button {
        background: linear-gradient(135deg, #ff6f61, #fe8f6a);
        color: #0e1a2b;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover:not([disabled]) {
        transform: translateY(-1px);
        box-shadow: 0 12px 25px rgba(254, 143, 106, 0.35);
      }

      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      video {
        width: 100%;
        border-radius: 10px;
        background: #000;
      }

      .status {
        min-height: 1.5em;
        font-size: 0.95rem;
        opacity: 0.85;
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Record from a Video Device</h1>
      <div>
        <label for="videoSource">Video source</label>
        <select id="videoSource"></select>
      </div>
      <video id="preview" playsinline autoplay muted></video>
      <button id="saveLocationButton">Choose Save Location</button>
      <button id="recordButton" disabled>Start Recording</button>
      <div class="status" id="status"></div>
    </main>
    <script>
      const videoSelect = document.getElementById("videoSource");
      const previewEl = document.getElementById("preview");
      const recordButton = document.getElementById("recordButton");
      const saveLocationButton = document.getElementById("saveLocationButton");
      const statusEl = document.getElementById("status");

      let currentStream = null;
      let mediaRecorder = null;
      let fileHandle = null;
      let writableStream = null;
      const supportsFileSystemAccess =
        typeof window.showSaveFilePicker === "function" && window.isSecureContext;

      const isSecure = window.isSecureContext;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#ffb4a2" : "";
      }

      if (!isSecure) {
        recordButton.disabled = true;
        saveLocationButton.disabled = true;
        setStatus(
          "Camera access and direct-to-disk saving require HTTPS (or localhost). Please host this page securely.",
          true
        );
      } else if (!supportsFileSystemAccess) {
        saveLocationButton.disabled = true;
        setStatus(
          "This browser disables the File System Access API (for example Brave does this by default). Use Chrome, Edge, Arc, or another browser that lets you choose a save location.",
          true
        );
      }

      async function stopStream(stream) {
        if (!stream) return;
        stream.getTracks().forEach((track) => track.stop());
      }

      function updateRecordButtonState() {
        const readyToRecord = Boolean(currentStream && fileHandle);
        if (mediaRecorder && mediaRecorder.state === "recording") {
          recordButton.disabled = false;
        } else {
          recordButton.disabled = !readyToRecord;
        }
      }

      async function populateVideoDevices(devices) {
        const videoDevices = devices.filter((device) => device.kind === "videoinput");
        const previousSelection = videoSelect.value;
        videoSelect.innerHTML = "";

        if (videoDevices.length === 0) {
          const option = document.createElement("option");
          option.textContent = "No video devices found";
          option.value = "";
          videoSelect.appendChild(option);
          recordButton.disabled = true;
          setStatus("No video inputs available.", true);
          return;
        }

        let selectedDeviceId = "";

        for (const device of videoDevices) {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Camera ${videoSelect.length + 1}`;
          if (!selectedDeviceId) {
            selectedDeviceId = device.deviceId;
          }
          if (previousSelection && previousSelection === device.deviceId) {
            selectedDeviceId = device.deviceId;
          }
          videoSelect.appendChild(option);
        }

        videoSelect.value = previousSelection && selectedDeviceId === previousSelection ? previousSelection : selectedDeviceId;
        updateRecordButtonState();

        if (!currentStream && videoSelect.value !== null) {
          startPreview(videoSelect.value || undefined);
        }
      }

      async function refreshDevices() {
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          await populateVideoDevices(devices);
        } catch (error) {
          console.error("Failed to enumerate devices", error);
          setStatus("Unable to list video devices.", true);
        }
      }

      async function startPreview(deviceId) {
        try {
          await stopStream(currentStream);
          const constraints = {
            audio: false,
            video: deviceId ? { deviceId: { exact: deviceId } } : true,
          };
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          previewEl.srcObject = currentStream;
          setStatus("Previewing device.");
          updateRecordButtonState();
        } catch (error) {
          console.error("Failed to start preview", error);
          const hint =
            error.name === "NotAllowedError"
              ? "Check that camera permissions are granted."
              : error.name === "NotReadableError"
              ? "Another application may already be using the device."
              : "";
          setStatus(`Failed to access the selected device. ${hint}`.trim(), true);
          recordButton.disabled = true;
        }
      }

      videoSelect.addEventListener("change", (event) => {
        const deviceId = event.target.value;
        startPreview(deviceId || undefined);
      });

      saveLocationButton.addEventListener("click", async () => {
        if (!supportsFileSystemAccess) {
          setStatus(
            "Selecting a save location requires a browser with File System Access support (Chrome, Edge, Arc, etc.).",
            true
          );
          return;
        }

        try {
          fileHandle = await window.showSaveFilePicker({
            types: [
              {
                description: "WebM Video",
                accept: { "video/webm": [".webm"] },
              },
            ],
            suggestedName: `recording-${new Date().toISOString().replace(/[:.]/g, "-")}.webm`,
          });
          setStatus("Save location ready. Start recording when you're ready.");
          updateRecordButtonState();
        } catch (error) {
          if (error.name !== "AbortError") {
            console.error("Save location selection failed", error);
            setStatus("Unable to select a save location.", true);
          }
        }
      });

      recordButton.addEventListener("click", async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
          return;
        }

        if (!currentStream) {
          setStatus("Select a video source first.", true);
          return;
        }

        if (!fileHandle) {
          setStatus("Choose a save location before recording.", true);
          return;
        }

        try {
          writableStream = await fileHandle.createWritable();
        } catch (error) {
          console.error("Failed to open writable stream", error);
          setStatus("Could not open the selected file for writing.", true);
          return;
        }

        saveLocationButton.disabled = true;

        try {
          mediaRecorder = new MediaRecorder(currentStream, {
            mimeType: "video/webm;codecs=vp9,opus",
          });
        } catch (error) {
          console.warn("Falling back to default MediaRecorder", error);
          mediaRecorder = new MediaRecorder(currentStream);
        }

        mediaRecorder.ondataavailable = async (event) => {
          if (event.data && event.data.size > 0 && writableStream) {
            try {
              await writableStream.write(event.data);
            } catch (error) {
              console.error("Failed to write chunk", error);
              setStatus("Writing to disk failed. Recording stopped.", true);
              mediaRecorder?.stop();
            }
          }
        };

        mediaRecorder.onstart = () => {
          setStatus("Recording...");
          recordButton.textContent = "Stop Recording";
          recordButton.disabled = false;
        };

        mediaRecorder.onstop = async () => {
          recordButton.textContent = "Start Recording";
          saveLocationButton.disabled = false;
          if (writableStream) {
            try {
              await writableStream.close();
              setStatus("Recording saved to the selected location.");
            } catch (error) {
              console.error("Failed to close writable stream", error);
              setStatus("Recording finished, but saving may have failed.", true);
            } finally {
              writableStream = null;
              fileHandle = null;
            }
          } else {
            setStatus("Recording stopped.");
          }
          updateRecordButtonState();
        };

        mediaRecorder.onerror = (event) => {
          console.error("MediaRecorder error", event.error);
          setStatus(`Error: ${event.error?.message || event.error}`, true);
        };

        mediaRecorder.start();
        recordButton.disabled = false;
      });

      async function init() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("Your browser does not support media capture.", true);
          recordButton.disabled = true;
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          await stopStream(stream);
        } catch (error) {
          console.error("Permission denied or no devices", error);
          const needsSecureContext = !isSecure
            ? " (open this page via HTTPS or localhost)"
            : "";
          setStatus(
            `Unable to access video devices. Check permissions${needsSecureContext}.`,
            true
          );
        } finally {
          await refreshDevices();
          if (videoSelect.value) {
            startPreview(videoSelect.value);
          }
        }
      }

      window.addEventListener("beforeunload", () => {
        stopStream(currentStream);
        fileHandle = null;
        writableStream = null;
      });

      init();
    </script>
  </body>
</html>
